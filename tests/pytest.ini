[pytest]
# The exhaustive comparisons are deselected by default. They ask Jena for
# every ordered pair of 4,596 states, seven predicates at a time, and take
# twelve minutes against ninety seconds for everything else. `docker compose
# up --build` should not make somebody wait that long to find out whether the
# thing works.
#
# What the default run still does is the same comparison over tokyo23 and
# ne-admin0, 281 features rather than 4,877. That is a real cross-check
# between two implementations, not a smoke test.
#
#   docker compose run --rm tests              # the default, about ninety seconds
#   docker compose run --rm tests -m full      # only the exhaustive ones
#   docker compose run --rm tests -m ""        # everything
addopts = -m "not full"
markers =
    full: over every source, including ne-admin1's 4,596 features
